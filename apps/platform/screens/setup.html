<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex, nofollow" name="robots"/>
<title>AIbeaty — Set up Maya</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@500;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- QR codes for the salon's chat link, drawn in the browser (MIT, kazuhikoarase). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<style>
  /* Luminous Core M3 light (tailwind.config.js), mirrored like login.html / digest.html.
     The wizard's one layout primitive is the ledger row: the step rail, the service
     list, the team, the plans and the add-ons are all hairline-ruled rows, never card grids. */
  :root {
    --bg: #f5f6f7;
    --surface-lowest: #ffffff;
    --surface-low: #eff1f2;
    --surface-container: #e6e8ea;
    --surface-variant: #dadddf;
    --on-surface: #2c2f30;
    --on-surface-variant: #595c5d;
    --outline: #757778;
    --outline-variant: #abadae;
    --ink: #17181b;
    --primary: #4d2afa;
    --primary-dim: #400aef;
    --primary-tint: rgba(77, 42, 250, .06);
    --on-primary: #ffffff;
    --tertiary-container: #c79eff;
    --on-tertiary-container: #450087;
    --secondary-container: #97daff;
    --on-secondary-container: #004d68;
    --ok: #0b6b3a;
    --ok-bg: rgba(11, 107, 58, .08);
    --error: #b41340;
    --error-bg: rgba(180, 19, 64, .06);
    --on-error-container: #510017;
    --r-sm: 0.25rem;
    --r-xl: 0.5rem;
    --r-full: 0.75rem;
    --font-headline: "Manrope", sans-serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --settle: cubic-bezier(.2, 0, 0, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--on-surface); font-family: var(--font-body); font-size: 14px; -webkit-font-smoothing: antialiased; }
  .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400; vertical-align: middle; font-size: 20px; }
  a { color: var(--primary); }
  button { font-family: var(--font-body); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---- top bar ---- */
  .bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 24px; background: rgba(245, 246, 247, .92);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--surface-variant);
  }
  .disc {
    width: 34px; height: 34px; border-radius: var(--r-full); flex-shrink: 0;
    background: linear-gradient(135deg, #4d2afa, #7a25db);
    display: flex; align-items: center; justify-content: center;
    font: 800 16px var(--font-headline); color: var(--on-primary);
  }
  .bar .salon { font: 800 15px var(--font-headline); color: var(--ink); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--surface-container); color: var(--on-surface-variant); white-space: nowrap; }
  .pill.live { background: var(--ok-bg); color: var(--ok); }
  .bar .grow { flex: 1; }
  .ghost {
    font: 600 12.5px var(--font-body); color: var(--on-surface-variant); background: none;
    border: 1px solid var(--surface-variant); border-radius: var(--r-xl); padding: 6px 10px; cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .ghost:hover { border-color: var(--outline); color: var(--on-surface); }
  #saved { font-size: 12px; color: var(--on-surface-variant); text-align: right; white-space: nowrap; }
  #saved.err { color: var(--error); font-weight: 600; }
  /* Language: a segmented EN · FR (· RU only for ru/uk browsers). */
  .langs { display: inline-flex; border: 1px solid var(--surface-variant); border-radius: var(--r-xl); overflow: hidden; }
  .langs button { font: 700 11.5px var(--font-body); letter-spacing: .04em; color: var(--on-surface-variant); background: none; border: 0; padding: 6px 9px; cursor: pointer; }
  .langs button + button { border-left: 1px solid var(--surface-variant); }
  .langs button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  /* ---- layout: step rail + panel ---- */
  .wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; max-width: 1120px; margin: 0 auto; padding: 32px 24px 80px; }
  .side { position: sticky; top: 84px; align-self: start; }
  .progress { margin: 0 0 12px; }
  .progress .txt { font-size: 12.5px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 7px; }
  .progress .track { height: 4px; border-radius: 99px; background: var(--surface-container); overflow: hidden; }
  .progress .fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width 300ms var(--settle); }
  .rail { border-top: 1px solid var(--surface-variant); }
  .rail button {
    width: 100%; display: grid; grid-template-columns: 26px 1fr 20px; align-items: center; gap: 8px;
    padding: 11px 4px; background: none; border: 0; border-bottom: 1px solid var(--surface-variant);
    text-align: left; cursor: pointer; color: var(--on-surface-variant); font-size: 13.5px; font-weight: 600;
  }
  .rail button .n { font: 700 12px var(--font-headline); color: var(--outline); }
  .rail button:hover { color: var(--on-surface); }
  .rail button[aria-current="step"] { color: var(--ink); }
  .rail button[aria-current="step"] .n { color: var(--primary); }
  .rail .st { font-size: 18px; color: var(--outline-variant); display: flex; justify-content: center; }
  .rail .st.done { color: var(--ok); }
  .rail .st.fix { color: var(--error); }
  .rail .dot { width: 8px; height: 8px; border-radius: 99px; border: 1.5px solid var(--outline-variant); display: inline-block; }

  .panel { min-width: 0; }
  .panel h1 { font: 800 28px/1.12 var(--font-headline); letter-spacing: -0.03em; color: var(--ink); margin: 0 0 8px; }
  .panel .lede { font-size: 14.5px; line-height: 1.55; color: var(--on-surface-variant); margin: 0 0 26px; max-width: 64ch; }
  .panel h2 { font: 800 16px var(--font-headline); color: var(--ink); margin: 30px 0 10px; letter-spacing: -0.01em; }
  .step { animation: settle 300ms var(--settle); }
  @keyframes settle { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---- fields ---- */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; align-content: start; }
  .field > label, .lbl { font-size: 12px; font-weight: 700; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.04em; }
  .hint { font-size: 12.5px; color: var(--on-surface-variant); line-height: 1.45; }
  input, select, textarea {
    width: 100%; font-family: var(--font-body); font-size: 14.5px; color: var(--on-surface);
    background: var(--surface-lowest); border: 1px solid var(--outline-variant);
    border-radius: var(--r-xl); padding: 10px 12px; outline: none;
    transition: border-color 150ms var(--settle), box-shadow 150ms var(--settle);
  }
  textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
  input:hover, select:hover, textarea:hover { border-color: var(--outline); }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(77, 42, 250, .14); }
  input::placeholder, textarea::placeholder { color: #8b8e8f; }
  .bad { border-color: var(--error) !important; background: var(--error-bg); }
  input[type="checkbox"], input[type="radio"] { width: 17px; height: 17px; accent-color: var(--primary); padding: 0; margin: 0; flex-shrink: 0; }
  .ferr { display: none; font-size: 12.5px; line-height: 1.45; color: var(--error); font-weight: 500; }
  .ferr.on { display: block; }

  .btn {
    font: 700 14px var(--font-body); color: var(--on-primary); background: var(--primary);
    border: 1px solid var(--primary); border-radius: var(--r-xl); padding: 11px 16px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    transition: background 150ms var(--settle), transform 120ms var(--settle);
  }
  .btn:hover { background: var(--primary-dim); }
  .btn:active { transform: scale(.985); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn[disabled]:hover { background: var(--primary); }
  .btn.quiet { background: var(--surface-lowest); color: var(--on-surface); border-color: var(--outline-variant); }
  .btn.quiet:hover { border-color: var(--outline); background: var(--surface-low); }
  .btn.small { font-size: 13px; padding: 7px 11px; }
  .btn.wide { width: 100%; }
  .linkbtn { background: none; border: 0; color: var(--primary); font: 600 13px var(--font-body); cursor: pointer; padding: 4px 0; }
  .linkbtn:hover { text-decoration: underline; }
  .iconbtn { background: none; border: 0; color: var(--outline); cursor: pointer; padding: 4px; border-radius: var(--r-sm); display: inline-flex; }
  .iconbtn:hover { color: var(--error); background: var(--error-bg); }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--surface-variant); }

  /* ---- hours ---- */
  .hours { border-top: 1px solid var(--surface-variant); }
  .hours .row { display: grid; grid-template-columns: 120px 110px 1fr; align-items: center; gap: 12px; padding: 8px 2px; border-bottom: 1px solid var(--surface-variant); }
  .hours .row .ferr { grid-column: 1 / -1; }
  .hours .row .day { font-weight: 600; }
  .hours .times { display: flex; align-items: center; gap: 8px; }
  .hours .times input { width: 110px; font-family: var(--font-mono); font-size: 13.5px; }
  .hours .closed { color: var(--on-surface-variant); font-size: 13px; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }

  /* ---- import box: the one tinted surface on the services step ---- */
  .import { background: var(--surface-lowest); border: 1px solid var(--surface-variant); border-radius: var(--r-full); padding: 18px 18px 16px; margin-bottom: 26px; }
  .import .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .import .head .disc { width: 28px; height: 28px; font-size: 13px; }
  .import .head b { font: 800 15px var(--font-headline); color: var(--ink); }
  .import .row2 { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 10px; align-items: center; }
  .note { display: none; margin-top: 12px; font-size: 13px; line-height: 1.45; padding: 10px 12px; border-radius: var(--r-xl); }
  .note.on { display: block; }
  .note.ok { background: var(--ok-bg); color: var(--ok); }
  .note.err { background: rgba(180, 19, 64, .07); color: var(--on-error-container); }

  /* ---- ruled rows for services / team / Q&A ---- */
  .rows { border-top: 1px solid var(--surface-variant); }
  .shead, .srow .l1 { display: grid; grid-template-columns: minmax(0, 1.5fr) 84px minmax(0, 1.25fr) 30px; gap: 8px; align-items: start; }
  .shead { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--on-surface-variant); padding: 8px 0; border-bottom: 1px solid var(--surface-variant); }
  .srow { padding: 9px 0; border-bottom: 1px solid var(--surface-variant); display: grid; gap: 7px; }
  .srow input, .srow textarea { padding: 8px 10px; font-size: 14px; }
  .srow textarea.price { min-height: 0; height: 38px; resize: none; overflow: hidden; field-sizing: content; line-height: 1.4; }
  .srow .l2 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
  .srow .l2 input.cat { width: 200px; padding: 6px 9px; font-size: 13px; }
  .srow .opt { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--on-surface-variant); cursor: pointer; }
  .srow .guess { font-size: 12px; color: var(--on-tertiary-container); }
  .srow.consult textarea.price { color: var(--on-surface-variant); background: var(--surface-low); }
  .trow { padding: 12px 0; border-bottom: 1px solid var(--surface-variant); display: grid; gap: 10px; }
  .trow .top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 30px; gap: 8px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 600 12.5px var(--font-body); padding: 5px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--surface-variant); background: var(--surface-lowest); color: var(--on-surface-variant);
  }
  .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .qrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) 30px; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--surface-variant); }
  .aside { font-size: 12.5px; color: var(--on-surface-variant); line-height: 1.5; padding: 10px 12px; border-left: 2px solid var(--surface-variant); margin: 14px 0 0; }

  /* ---- go live ---- */
  .todo { border-top: 1px solid var(--surface-variant); margin-bottom: 18px; }
  .todo .item { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 10px 2px; border-bottom: 1px solid var(--surface-variant); font-size: 13.5px; line-height: 1.45; }
  .todo .item .material-symbols-outlined { font-size: 18px; color: var(--outline); margin-top: 1px; }
  .todo .item.ok .material-symbols-outlined { color: var(--ok); }
  .livebox { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; align-items: start; }
  .chatcol { display: grid; gap: 12px; }
  .chathead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .chathead .lbl { margin: 0; }
  .phone { border: 1px solid var(--surface-variant); border-radius: 18px; overflow: hidden; height: 560px; background: var(--surface-lowest); }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; }
  .golive { border-top: 1px solid var(--surface-variant); padding-top: 14px; display: grid; gap: 8px; }
  .status { display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: var(--r-full); margin-bottom: 18px; line-height: 1.5; }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.wait { background: var(--surface-container); color: var(--on-surface); }
  .status.warn { background: rgba(180,19,64,.07); color: var(--on-error-container); }
  .tries { margin: 8px 0 0; padding-left: 18px; color: var(--on-surface-variant); line-height: 1.7; }

  /* ---- chat link + QR (step 6 hero, step 5 success) ---- */
  .linkwrap { container-type: inline-size; }
  @container (max-width: 560px) {
    .linkbox { grid-template-columns: minmax(0, 1fr) !important; justify-items: start; }
    .linkbox > div:last-child { width: 100%; }
  }
  .linkbox { display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 22px; align-items: start; padding: 18px; background: var(--surface-lowest); border: 1px solid var(--surface-variant); border-radius: var(--r-full); }
  .qr { width: 172px; height: 172px; border-radius: var(--r-xl); border: 1px solid var(--surface-variant); background: #fff; display: flex; align-items: center; justify-content: center; }
  .qr canvas { width: 156px; height: 156px; image-rendering: pixelated; }
  .linkbox .url { font-family: var(--font-mono); font-size: 13px; background: var(--surface-low); border: 1px solid var(--surface-variant); border-radius: var(--r-xl); padding: 9px 11px; overflow-wrap: anywhere; color: var(--ink); }
  .linkbox .acts { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 12px; }
  .where { border-top: 1px solid var(--surface-variant); margin: 0; padding: 0; }
  .where li { list-style: none; display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--surface-variant); font-size: 13px; line-height: 1.45; }
  .where li .material-symbols-outlined { font-size: 18px; color: var(--outline); }

  /* ---- channels ---- */
  .howto { counter-reset: how; border-top: 1px solid var(--surface-variant); margin: 6px 0 16px; padding: 0; }
  .howto li { list-style: none; counter-increment: how; display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 10px 2px; border-bottom: 1px solid var(--surface-variant); line-height: 1.5; }
  .howto li::before { content: counter(how); font: 700 12px var(--font-headline); color: var(--outline); padding-top: 2px; }
  code, .mono { font-family: var(--font-mono); font-size: 12.5px; }
  code { background: var(--surface-container); padding: 1px 5px; border-radius: var(--r-sm); }
  pre.snippet { font-family: var(--font-mono); font-size: 12px; background: var(--ink); color: #e9e8f5; padding: 14px; border-radius: var(--r-xl); overflow-x: auto; white-space: pre; margin: 8px 0; }
  .connected { display: grid; border-top: 1px solid var(--surface-variant); }
  .connected .line { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--surface-variant); }
  .connected .line .material-symbols-outlined { color: var(--ok); font-size: 19px; }
  .connected .line.pending .material-symbols-outlined { color: var(--outline); }
  .ownerqr { display: none; grid-template-columns: 148px 1fr; gap: 16px; align-items: center; padding: 12px 2px 12px 32px; border-bottom: 1px solid var(--surface-variant); }
  .ownerqr.ready { display: grid; }
  .ownerqr .qrbox { width: 148px; height: 148px; padding: 8px; background: #fff; border: 1px solid var(--surface-variant); border-radius: var(--r-xl); }
  .ownerqr .qrbox img, .ownerqr .qrbox canvas { display: block; width: 132px; height: 132px; }
  .ownerqr .hint { margin: 0; max-width: 40ch; }
  @media (max-width: 760px) { .ownerqr, .ownerqr.ready { display: none; } }
  .sechead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .sechead h2 { margin-bottom: 6px; }
  .sechead .tag { position: relative; top: -2px; }

  /* ---- plan ---- */
  .seg { display: inline-flex; border: 1px solid var(--outline-variant); border-radius: var(--r-xl); overflow: hidden; margin-bottom: 14px; }
  .seg button { font: 600 13px var(--font-body); background: var(--surface-lowest); border: 0; padding: 8px 13px; cursor: pointer; color: var(--on-surface-variant); }
  .seg button + button { border-left: 1px solid var(--outline-variant); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .plans, .addons { border-top: 1px solid var(--surface-variant); }
  .prow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 10px; border-bottom: 1px solid var(--surface-variant); cursor: pointer; transition: background 150ms var(--settle); }
  .prow:hover { background: var(--surface-low); }
  .prow.on { background: var(--primary-tint); box-shadow: inset 3px 0 0 var(--primary); }
  .prow .t { font: 800 16px var(--font-headline); color: var(--ink); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .prow .d { font-size: 13px; color: var(--on-surface-variant); margin-top: 3px; line-height: 1.45; }
  .prow .p { text-align: right; white-space: nowrap; }
  .prow .p b { font: 800 22px var(--font-headline); color: var(--ink); letter-spacing: -0.02em; }
  .prow .p span { font-size: 12.5px; color: var(--on-surface-variant); }
  .prow .p .sub { display: block; font-size: 11.5px; }
  .arow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 10px; border-bottom: 1px solid var(--surface-variant); cursor: pointer; }
  .arow:hover { background: var(--surface-low); }
  .arow .t { font-weight: 600; color: var(--on-surface); }
  .arow .d { font-size: 12.5px; color: var(--on-surface-variant); margin-top: 2px; }
  .arow .p { font-weight: 700; white-space: nowrap; color: var(--ink); }
  .a2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 10px; border-bottom: 1px solid var(--surface-variant); }
  .a2 .t { font-weight: 600; }
  .total { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; margin-top: 20px; padding: 16px 18px; background: var(--surface-lowest); border: 1px solid var(--surface-variant); border-radius: var(--r-full); }
  .total .sum { font: 800 24px var(--font-headline); color: var(--ink); letter-spacing: -0.02em; }
  .total .sum small { font: 500 13px var(--font-body); color: var(--on-surface-variant); letter-spacing: 0; }
  .total .how { font-size: 12.5px; color: var(--on-surface-variant); margin-top: 4px; line-height: 1.45; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .tag.active, .tag.paid { background: var(--ok-bg); color: var(--ok); }
  .tag.requested { background: var(--secondary-container); color: var(--on-secondary-container); }
  .tag.ready { background: var(--surface-container); color: var(--on-surface-variant); }
  .tag.fit { background: rgba(77, 42, 250, .1); color: var(--primary); font-family: var(--font-body); font-size: 11.5px; font-weight: 700; letter-spacing: 0; }
  .billedline { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--on-surface-variant); margin: -16px 0 20px; }
  .billedline .material-symbols-outlined { font-size: 17px; }
  .how.billed { margin-top: 4px; }
  .confirmed { margin-bottom: 22px; }

  // --- chat link + QR ---------------------------------------------------
  function qrMatrix(text) {
    if (typeof window.qrcode !== "function") return null;
    try {
      var qr = window.qrcode(0, "M");
      qr.addData(text);
      qr.make();
      return qr;
    } catch (error) { return null; }
  }
  function drawQr(canvas, text, px) {
    var qr = qrMatrix(text);
    if (!qr || !canvas) return false;
    var count = qr.getModuleCount();
    var quiet = 4;
    var cell = Math.max(1, Math.floor(px / (count + quiet * 2)));
    var size = cell * (count + quiet * 2);
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#17181b";
    for (var r = 0; r < count; r += 1) {
      for (var c = 0; c < count; c += 1) {
        if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
      }
    }
    return true;
  }
  function paintQrs() {
    var draw = function () {
      document.querySelectorAll("canvas[data-qr]").forEach(function (canvas) {
        if (!drawQr(canvas, canvas.getAttribute("data-qr"), 312)) canvas.parentNode.style.display = "none";
      });
    };
    if (typeof window.qrcode === "function") return draw();
    // The library loads with defer; try again shortly, then give up quietly.
    var tries = 0;
    var timer = setInterval(function () {
      tries += 1;
      if (typeof window.qrcode === "function" || tries > 20) { clearInterval(timer); draw(); }
    }, 150);
  }

      '<div class="sum">' + esc(money(totals.total)) + '<small>' + esc(annual ? t("perYear") : t("perMonth")) + ' ' + esc(t("plusTax")) + '</small></div>' +
      '<div class="how">' + esc(t("totalHow")(plan.seller)) + (annual ? " " + esc(t("annualSave")(totals.saving)) : "") + '</div>' +
      '<div class="how billed">' + esc(t("billedBy")(plan.seller, plan.sellerPlace || "Ottawa, Canada")) + '</div></div>' +
      '<div style="display:grid;gap:8px">' +
      '<button class="btn" type="button" id="planGo">' + esc(t("continueWith")(chosen)) + ' <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></button>' +
      (planEdit ? '<button class="btn quiet small" type="button" id="planKeep">' + t("keepChoice") + '</button>' : "") +
      '</div></div>';
  }

  function extrasBlock() {
    var byKey = {};
    (state.addons || []).forEach(function (addon) { byKey[addon.key] = addon; });
    function right(addon, label) {
      if (!addon) return "";
      if (addon.status === "requested") return '<span class="tag requested">' + t("requested") + '</span>';
      if (addon.status === "active" || addon.status === "paid") return '<span class="tag active">' + t("included") + '</span>';
      return '<button class="btn quiet small" type="button" data-request="' + esc(addon.key) + '">' + label + '</button>';
    }
    var dfy = byKey.done_for_you;
    var later = (state.addons || []).filter(function (addon) { return addon.later && addon.key !== "continue_after_trial"; });
    var proActive = state.tenant && state.tenant.planStatus === "active" && state.plan && state.plan.choice === "pro";
    return '<div class="addons" style="margin-top:28px"><div class="a2"><div><div class="t">' + esc(t("dfyTitle")) + '</div><div class="hint">' + esc(t("dfyLead")) + '</div></div>' +
      (proActive ? '<span class="tag active">' + t("included") + '</span>' : right(dfy, t("request"))) + '</div></div>' +
      '<div class="field" style="margin-top:10px"><label for="addonNote" class="sr">' + esc(t("noteLabel")) + '</label><input id="addonNote" placeholder="' + esc(t("notePh")) + '"/></div>' +
      (later.length ? '<h2>' + t("laterTitle") + '</h2><p class="hint" style="margin-top:-4px">' + t("laterLead") + '</p><div class="addons">' +
        later.map(function (addon) { return '<div class="a2"><div class="t">' + esc(addon.title) + '</div>' + right(addon, t("tellMe")) + '</div>'; }).join("") + '</div>' : "");
  }

  function submitPlan(button) {
    var p = currentPick();
    var addons = Object.keys(p.addons).filter(function (key) { return p.addons[key]; });
    busy(button, t("sending"));
    api("POST", "/api/setup/plan", { plan: p.plan, addons: addons, cycle: p.cycle }).then(function (result) {
      idle(button);
      if (result.status !== 200) return toast((result.data && result.data.message) || t("offline"));
      if (result.data.checkoutUrl) {
        toast(t("checkoutGo"));
        window.location.href = result.data.checkoutUrl;
        return;
      }
      state.plan = result.data.plan;
      state.tenant.planStatus = "pending_payment";
      state.tenant.trialEndsAt = result.data.trialEndsAt;
      planEdit = false;
      return refresh().then(function () {
        render();
        var box = $("planConfirmed");
        if (box) { box.scrollIntoView({ behavior: "smooth", block: "start" }); box.focus({ preventScroll: true }); }
        else window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }).catch(function () { idle(button); toast(t("offline")); });
  }

  var STEPS = [stepSalon, stepServices, stepTeam, stepAnswers, stepLive, stepChannels, stepPlan];

  function render() {
    paintChrome();
    if (!state.tenant) {
      $("panel").innerHTML = '<div class="status wait">' + esc(t("managed")) + '</div>';
      return;
    }
    $("panel").innerHTML = '<div class="step">' + STEPS[step]() + '</div>';
    paintQrCodes();
    var current = document.querySelector('.rail [aria-current="step"]');
    if (current && window.innerWidth <= 900) current.scrollIntoView({ block: "nearest", inline: "center" });
    if (document.querySelector("canvas[data-qr]")) paintQrs();
    clearInterval(testPoll);
    if (step === 4 && $("launchBtn")) {
      syncGoLive();
      testPoll = setInterval(syncGoLive, 1500);
    }
  }
  // The owner deep link as a QR code, for owners doing setup on a computer:
  // their Telegram is on the phone. Drawn with qrcode-generator (drawQr).
  function paintQrCodes(attempt) {
    var boxes = document.querySelectorAll("[data-owner-qr]");
    if (!boxes.length || !window.matchMedia("(min-width: 761px)").matches) return;
    if (typeof window.qrcode !== "function") {
      if ((attempt || 0) < 30) setTimeout(function () { paintQrCodes((attempt || 0) + 1); }, 200);
      return;
    }
    Array.prototype.forEach.call(boxes, function (box) {
      if (box.getAttribute("data-painted")) return;
      var canvas = document.createElement("canvas");
      if (!drawQr(canvas, box.getAttribute("data-owner-qr"), 264)) return;
      box.setAttribute("data-painted", "1");
      box.appendChild(canvas);
      box.closest(".ownerqr").classList.add("ready");
    });
  }

  function go(index) {
    if (step <= 4 && index !== step) touch(step);
    step = Math.max(0, Math.min(STEPS.length - 1, index));
    if (step !== 4) justLaunched = false;
    try { history.replaceState(null, "", window.location.pathname + window.location.search + "#" + (step + 1)); } catch (error) { /* ignore */ }
    flushSave();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ------------------------------------------------------------------ events
  function setPath(path, value) {
    var parts = path.split(".");
    var target = doc;
    for (var i = 0; i < parts.length - 1; i += 1) target = target[parts[i]];
    target[parts[parts.length - 1]] = value;
  }
  function listFor(name) { return name === "custom" ? doc.faq.custom : doc[name]; }
  function sameDays(a, b) { return a.length === b.length && a.every(function (day) { return b.indexOf(day) !== -1; }); }
  // Staff who still follow the salon's days follow a change in them too.
  function followHours(before) {
    var after = openDays();
    doc.staff.forEach(function (member) {
      if (sameDays(member.workDays, before)) member.workDays = after.slice();
    });
  }

  document.addEventListener("input", function (event) {
    var node = event.target;
    if (!doc) return;
    if (node.hasAttribute("data-path")) {
      setPath(node.getAttribute("data-path"), node.value);
      if (node.getAttribute("data-path") === "salon.name") $("salonName").textContent = node.value;
      scheduleSave();
    } else if (node.hasAttribute("data-list")) {
      var item = listFor(node.getAttribute("data-list"))[Number(node.getAttribute("data-i"))];
      var key = node.getAttribute("data-k");
      // Renaming a service keeps every team member's link to it.
      if (key === "name" && node.getAttribute("data-list") === "services" && item.name) {
        var before = item.name;
        doc.staff.forEach(function (member) {
          member.services = member.services.map(function (name) { return name === before ? node.value : name; });
        });
      }
      if (node.type === "checkbox") item[key] = node.checked;
      else if (key === "durationMinutes") { item[key] = Number(node.value) || 0; delete item._draft; }
      else item[key] = node.value;
      if (node.tagName === "TEXTAREA" && node.classList.contains("price")) autosize(node);
      scheduleSave();
      if (key === "consultOnly") render();
    } else if (node.hasAttribute("data-hours-from") || node.hasAttribute("data-hours-to")) {
      var day = node.getAttribute("data-hours-from") || node.getAttribute("data-hours-to");
      var from = document.querySelector('[data-hours-from="' + day + '"]').value;
      var to = document.querySelector('[data-hours-to="' + day + '"]').value;
      doc.hours[day] = from + "-" + to;
      scheduleSave();
    }
  });
  function autosize(node) {
    node.style.height = "auto";
    node.style.height = Math.max(38, node.scrollHeight + 2) + "px";
  }

  document.addEventListener("change", function (event) {
    var node = event.target;
    if (node.hasAttribute("data-hours-open")) {
      var before = openDays();
      var day = node.getAttribute("data-hours-open");
      doc.hours[day] = node.checked ? "10:00-19:00" : "closed";
      followHours(before);
      scheduleSave();
      render();
    } else if (node.tagName === "SELECT" && node.hasAttribute("data-path")) {
      setPath(node.getAttribute("data-path"), node.value);
      scheduleSave();
    } else if (node.name === "plan") {
      currentPick().plan = node.value;
      render();
    } else if (node.hasAttribute("data-addon")) {
      currentPick().addons[node.getAttribute("data-addon")] = node.checked;
      render();
    }
  });

  document.addEventListener("click", function (event) {
    var node = event.target.closest("button, a");
    if (!node) return;
    if (node.hasAttribute("data-step")) return go(Number(node.getAttribute("data-step")));
    if (node.hasAttribute("data-go")) return go(Number(node.getAttribute("data-go")));
    if (node.hasAttribute("data-lang")) return setLang(node.getAttribute("data-lang"));
    if (node.hasAttribute("data-add")) {
      var list = node.getAttribute("data-add");
      if (list === "services") doc.services.push({ name: "", category: "", durationMinutes: 60, price: "", deposit: false, consultOnly: false, keywords: [], note: "" });
      if (list === "staff") doc.staff.push({ name: "", role: "", services: [], workDays: openDays() });
      if (list === "custom") doc.faq.custom.push({ q: "", a: "" });
      touch(step);
      render();
      var inputs = document.querySelectorAll('[data-list="' + list + '"][data-k="' + (list === "custom" ? "q" : "name") + '"]');
      if (inputs.length) inputs[inputs.length - 1].focus();
      return;
    }
    if (node.hasAttribute("data-remove")) {
      var removed = listFor(node.getAttribute("data-remove")).splice(Number(node.getAttribute("data-i")), 1)[0];
      if (node.getAttribute("data-remove") === "services" && removed) {
        doc.staff.forEach(function (member) { member.services = member.services.filter(function (name) { return name !== removed.name; }); });
      }
      touch(step);
      clearTimeout(saveTimer);
      save();
      return render();
    }
    if (node.hasAttribute("data-starter")) {
      (STARTERS[node.getAttribute("data-starter")] || STARTERS.multi).forEach(function (row) {
        doc.services.push({ name: row[0], category: row[1], durationMinutes: row[2], price: "", deposit: false, consultOnly: Boolean(row[3]), keywords: [], note: "", _draft: true });
      });
      touch(step);
      clearTimeout(saveTimer);
      save();
      render();
      var firstPrice = document.querySelector('textarea.price:not([disabled])');
      if (firstPrice) firstPrice.focus();
      return;
    }
    if (node.hasAttribute("data-day")) {
      var member = doc.staff[Number(node.getAttribute("data-i"))];
      var day = node.getAttribute("data-day");
      var at = member.workDays.indexOf(day);
      if (at === -1) member.workDays.push(day); else member.workDays.splice(at, 1);
      scheduleSave();
      return render();
    }
    if (node.hasAttribute("data-all")) {
      doc.staff[Number(node.getAttribute("data-all"))].services = [];
      scheduleSave();
      return render();
    }
    if (node.hasAttribute("data-svc")) {
      var who = doc.staff[Number(node.getAttribute("data-i"))];
      var name = node.getAttribute("data-svc");
      var index = who.services.indexOf(name);
      if (index === -1) who.services.push(name); else who.services.splice(index, 1);
      scheduleSave();
      return render();
    }
    if (node.hasAttribute("data-cycle")) {
      currentPick().cycle = node.getAttribute("data-cycle");
      return render();
    }
    if (node.id === "importBtn") return runImport(node);
    if (node.id === "launchBtn") return openConfirm();
    if (node.id === "resetChat") {
      lsDel(LOG_PREFIX + slug());
      lsDel(SESSION_PREFIX + slug());
      var frame = $("testChat");
      if (frame) frame.src = chatSrc() + "&r=" + Date.now();
      syncGoLive();
      return toast(t("resetDone"));
    }
    if (node.id === "qrDownload") return downloadQr();
    if (node.id === "planGo") return submitPlan(node);
    if (node.id === "planEdit") { planEdit = true; picked = null; return render(); }
    if (node.id === "planKeep") { planEdit = false; picked = null; return render(); }
    if (node.id === "tgConnect") return connectTelegram(node);
    if (node.id === "tgDisconnect") {
      return api("DELETE", "/api/setup/telegram").then(refresh).then(render);
    }
    if (node.hasAttribute("data-copy") || node.hasAttribute("data-copy-snippet")) {
      var text = node.hasAttribute("data-copy") ? node.getAttribute("data-copy") : state.widgetSnippet;
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast(t("copied")); }).catch(function () { toast(text); });
      return;
    }
    if (node.hasAttribute("data-request")) {
      node.disabled = true;
      var note = ($("addonNote") && $("addonNote").value) || "";
      return api("POST", "/api/setup/addons", { addon: node.getAttribute("data-request"), note: note }).then(function (result) {
        if (result.data && result.data.addons) state.addons = result.data.addons;
        toast(t("requestedToast"));
        render();
      });
    }
    if (node.id === "logout") {
      return fetch("/api/auth/logout", { method: "POST" }).then(function () { window.location.replace("/screens/login.html"); });
    }
  });

  $("confirmNo").addEventListener("click", function () { $("confirm").close(); });
  $("confirmYes").addEventListener("click", function () { $("confirm").close(); launchNow(); });
  // The test chat writes its transcript to this origin's storage: enable Go live
  // as soon as the owner has sent something.
  window.addEventListener("storage", function (event) {
    if (event.key && event.key.indexOf(LOG_PREFIX) === 0) syncGoLive();
  });

  function setLang(code) {
    if (code === lang) return;
    lang = code;
    lsSet("aibeaty-lang", lang);
    render();
    // The salon remembers it: validation messages and alerts follow.
    if (state && state.tenant) {
      api("PUT", "/api/setup/language", { language: lang }).then(function () {
        state.tenant.language = lang;
        if (doc) save();
        return api("GET", "/api/setup/plan");
      }).then(function (result) {
        if (result && result.status === 200) { state.plan = result.data; if (step === 6) render(); }
      }).catch(function () { /* offline: stays local */ });
    }
  }

  // ------------------------------------------------------------------ actions
  function busy(button, label) {
    button.disabled = true;
    button.dataset.label = button.innerHTML;
    button.innerHTML = '<span class="spin" aria-hidden="true"></span> ' + esc(label);
  }
  function idle(button) {
    button.disabled = false;
    if (button.dataset.label) button.innerHTML = button.dataset.label;
  }
  function note(id, kind, text) {
    var node = $(id);
    if (!node) return;
    node.className = "note on " + kind;
    node.textContent = text;
  }

  function runImport(button) {
    var text = $("importText").value;
    var url = $("importUrl").value.trim();
    busy(button, t("importing"));
    api("POST", "/api/setup/extract", { text: text, url: url || undefined }).then(function (result) {
      idle(button);
      if (result.status !== 200) return note("importNote", "err", (result.data && result.data.message) || t("importNone"));
      var draft = result.data.draft;
      if (!draft.services.length) return note("importNote", "err", t("importNone"));
      var existing = {};
      doc.services.forEach(function (service) { existing[service.name.toLowerCase()] = true; });
      draft.services.forEach(function (service) {
        if (!existing[service.name.toLowerCase()]) doc.services.push(Object.assign({ deposit: false, consultOnly: false, keywords: [], note: "" }, service, { _draft: true }));
      });
      var names = {};
      doc.staff.forEach(function (member) { names[member.name.toLowerCase()] = true; });
      var addedStaff = 0;
      var before = openDays();
      Object.keys(draft.hours || {}).forEach(function (day) {
        if (DAYS.indexOf(day) !== -1 && draft.hours[day]) doc.hours[day] = draft.hours[day];
      });
      followHours(before);
      draft.staff.forEach(function (member) {
        if (member.name && !names[member.name.toLowerCase()]) {
          doc.staff.push({ name: member.name, role: member.role || "", services: [], workDays: openDays() });
          addedStaff += 1;
        }
      });
      ["address", "phone", "website", "instagram"].forEach(function (key) {
        if (draft.salon && draft.salon[key] && !doc.salon[key]) doc.salon[key] = draft.salon[key];
      });
      if (url && !doc.salon.website) doc.salon.website = url;
      ["parking", "payment", "cancellation", "deposit", "late"].forEach(function (key) {
        if (draft.faq && draft.faq[key] && !doc.faq[key]) doc.faq[key] = draft.faq[key];
      });
      // The draft is saved right away: a reload must never lose it.
      touch(1);
      clearTimeout(saveTimer);
      save();
      render();
      note("importNote", "ok", t("imported")(draft.services.length, addedStaff));
    }).catch(function () {
      idle(button);
      note("importNote", "err", t("offline"));
    });
  }

  function connectTelegram(button) {
    var token = ($("tgToken").value || "").trim();
    if (!token) return $("tgToken").focus();
    busy(button, t("connecting"));
    api("POST", "/api/setup/telegram", { token: token }).then(function (result) {
      idle(button);
      if (result.status !== 200) return note("tgNote", "err", result.data.message);
      state.telegram = result.data;
      render();
    }).catch(function () {
      idle(button);
      note("tgNote", "err", t("offline"));
    });
  }

  // The owner links Telegram or pays in another tab; notice it when they come back.
  function refresh() {
    return api("GET", "/api/setup").then(function (result) {
      if (result.status !== 200) return;
      state.telegram = result.data.telegram;
      state.addons = result.data.addons;
      state.tenant = result.data.tenant;
      state.plan = result.data.plan;
      if (step === 5 || step === 6) render(); else paintChrome();
    });
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden && state) refresh(); });
  // Links like setup.html#7 (trial notices) work on an open page too.
  window.addEventListener("hashchange", function () {
    var target = Number((window.location.hash || "").replace("#", ""));
    if (state && target >= 1 && target <= STEPS.length && target - 1 !== step) go(target - 1);
  });

  // ------------------------------------------------------------------ boot
  var stored = lsGet("aibeaty-lang");
  if (stored === "en" || stored === "fr" || stored === "ru") lang = stored;
  else {
    var nav = "";
    try { nav = String(navigator.language || ""); } catch (error) { nav = ""; }
    lang = /^fr/i.test(nav) ? "fr" : /^(ru|uk)/i.test(nav) ? "ru" : "en";
  }

  api("GET", "/api/setup").then(function (result) {
    if (result.status !== 200) { $("panel").textContent = t("loadFail"); return; }
    state = result.data;
    if (state.tenant && !stored) lang = state.tenant.language || lang;
    if (lang === "ru" && !browserRu() && !(state.tenant && state.tenant.language === "ru")) lang = "en";
    doc = state.setup || null;
    try { (JSON.parse(lsGet("aibeaty-touched." + slug()) || "[]") || []).forEach(function (index) { touched[index] = true; }); } catch (error) { /* ignore */ }
    var fromHash = Number((window.location.hash || "").replace("#", ""));
    if (fromHash >= 1 && fromHash <= STEPS.length) step = fromHash - 1;
    else if (state.tenant && state.tenant.launched) step = 5;
    render();
    // First validation pass so the rail and the go-live list are accurate at once.
    if (doc) save();
    if (/[?&]paid=1/.test(window.location.search)) setTimeout(refresh, 4000);
  }).catch(function () { $("panel").textContent = t("loadFail"); });
})();
</script>
</body></html>
