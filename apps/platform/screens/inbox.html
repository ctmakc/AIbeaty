<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex, nofollow" name="robots"/>
<title>AIbeaty — Inbox</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
  /* A self-serve salon's inbox. Luminous Core M3 light (tailwind.config.js),
     mirrored like setup.html. One list primitive (the ledger row), and the chat
     bubbles of screens/chat.html seen from the salon's side of the counter. */
  :root {
    --bg: #f5f6f7;
    --surface-lowest: #ffffff;
    --surface-low: #eff1f2;
    --surface-container: #e6e8ea;
    --surface-variant: #dadddf;
    --on-surface: #2c2f30;
    --on-surface-variant: #595c5d;
    --outline: #757778;
    --outline-variant: #abadae;
    --ink: #17181b;
    --primary: #4d2afa;
    --primary-dim: #400aef;
    --on-primary: #ffffff;
    --tertiary: #7a25db;
    --tertiary-container: #c79eff;
    --on-tertiary-container: #450087;
    --secondary: #006384;
    --ok: #0b6b3a;
    --ok-bg: rgba(11, 107, 58, .08);
    --error: #b41340;
    --error-bg: rgba(180, 19, 64, .07);
    --r-sm: 0.25rem;
    --r-xl: 0.5rem;
    --r-full: 0.75rem;
    --font-headline: "Manrope", sans-serif;
    --font-body: "Inter", sans-serif;
    --settle: cubic-bezier(.2, 0, 0, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--on-surface); font-family: var(--font-body); font-size: 14px; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
  .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400; vertical-align: middle; font-size: 20px; }
  a { color: var(--primary); }
  button { font-family: var(--font-body); }
  [hidden] { display: none !important; }

  /* ---- top bar (setup.html's bar) ---- */
  .bar {
    flex-shrink: 0; display: flex; align-items: center; gap: 12px;
    padding: 12px 24px; background: rgba(245, 246, 247, .92);
    border-bottom: 1px solid var(--surface-variant);
  }
  .disc {
    width: 34px; height: 34px; border-radius: var(--r-full); flex-shrink: 0;
    background: linear-gradient(135deg, #4d2afa, #7a25db);
    display: flex; align-items: center; justify-content: center;
    font: 800 16px var(--font-headline); color: var(--on-primary);
  }
  .bar .salon { font: 800 15px var(--font-headline); color: var(--ink); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bar .where { font-size: 13px; color: var(--on-surface-variant); font-weight: 600; white-space: nowrap; }
  .bar .grow { flex: 1; }
  .bar .who { font-size: 12.5px; color: var(--on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .ghost {
    font: 600 12.5px var(--font-body); color: var(--on-surface-variant); background: none;
    border: 1px solid var(--surface-variant); border-radius: var(--r-xl); padding: 6px 10px; cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .ghost:hover { border-color: var(--outline); color: var(--on-surface); }
  .ghost { display: inline-flex; align-items: center; gap: 4px; }
  .ghost .ico { display: none; font-size: 18px; }

  /* ---- two panes ---- */
  .panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); }
  .list { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--surface-variant); background: var(--surface-lowest); }
  .list-head { padding: 18px 20px 12px; }
  .list-head h1 { font: 800 20px var(--font-headline); letter-spacing: -0.02em; color: var(--ink); margin: 0 0 12px; }
  .seg { display: inline-flex; border: 1px solid var(--surface-variant); border-radius: var(--r-xl); overflow: hidden; }
  .seg button { background: none; border: 0; padding: 6px 12px; font-size: 12.5px; font-weight: 600; color: var(--on-surface-variant); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--surface-variant); }
  .seg button[aria-pressed="true"] { background: var(--surface-container); color: var(--ink); }
  .rows { flex: 1; overflow-y: auto; border-top: 1px solid var(--surface-variant); }
  .row {
    width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: start;
    padding: 12px 20px; border: 0; border-bottom: 1px solid var(--surface-variant); background: none; text-align: left; cursor: pointer; color: inherit;
  }
  .row:hover { background: var(--surface-low); }
  .row[aria-current="true"] { background: rgba(77, 42, 250, .06); box-shadow: inset 3px 0 0 var(--primary); }
  .ava {
    width: 36px; height: 36px; border-radius: 999px; background: var(--surface-container); color: var(--on-surface-variant);
    display: flex; align-items: center; justify-content: center; font: 700 13px var(--font-headline);
  }
  .ava .material-symbols-outlined { font-size: 18px; }
  .row .name { font-weight: 700; font-size: 13.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12px; color: var(--on-surface-variant); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .when { font-size: 11.5px; color: var(--on-surface-variant); white-space: nowrap; text-align: right; }
  .flag { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .flag.need { background: var(--error-bg); color: var(--error); }
  .flag.you { background: var(--surface-container); color: var(--on-surface-variant); }
  .flag.test { background: rgba(122, 37, 219, .08); color: var(--tertiary); }
  .empty { padding: 28px 20px; color: var(--on-surface-variant); line-height: 1.55; font-size: 13.5px; }
  .empty strong { display: block; color: var(--ink); font: 800 15px var(--font-headline); margin-bottom: 6px; }

  /* ---- thread ---- */
  .thread { min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
  .thread-head {
    flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 14px 24px;
    background: var(--surface-lowest); border-bottom: 1px solid var(--surface-variant);
  }
  .back { display: none; background: none; border: 0; padding: 4px; margin-left: -6px; color: var(--on-surface); cursor: pointer; border-radius: var(--r-sm); }
  .thread-head .title { min-width: 0; flex: 1; }
  .thread-head h2 { font: 800 17px var(--font-headline); color: var(--ink); margin: 0; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-head .meta { font-size: 12.5px; color: var(--on-surface-variant); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; background: var(--ok-bg); color: var(--ok); }
  .state.need { background: var(--error-bg); color: var(--error); }
  .state.you { background: var(--surface-container); color: var(--on-surface-variant); }
  .btn {
    font: 700 13px var(--font-body); color: var(--on-primary); background: var(--primary);
    border: 1px solid var(--primary); border-radius: var(--r-xl); padding: 8px 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: background 150ms var(--settle), transform 120ms var(--settle);
  }
  .btn:hover { background: var(--primary-dim); }
  .btn:active { transform: scale(.985); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn.quiet { background: var(--surface-lowest); color: var(--on-surface); border-color: var(--outline-variant); }
  .btn.quiet:hover { border-color: var(--outline); background: var(--surface-low); }

  .feed { flex: 1; overflow-y: auto; padding: 20px 24px 12px; display: flex; flex-direction: column; gap: 10px; }
  .day { align-self: center; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--on-surface-variant); background: var(--surface-container); padding: 4px 10px; border-radius: 999px; margin: 6px 0; }
  .msg { display: flex; flex-direction: column; max-width: min(560px, 78%); }
  .msg.in { align-self: flex-start; align-items: flex-start; }
  .msg.out { align-self: flex-end; align-items: flex-end; }
  .bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.in .bubble { background: var(--surface-lowest); border: 1px solid var(--surface-variant); border-top-left-radius: 4px; }
  .msg.maya .bubble { background: rgba(199, 158, 255, .22); color: var(--ink); border-top-right-radius: 4px; }
  .msg.staff .bubble { background: var(--primary); color: var(--on-primary); border-top-right-radius: 4px; }
  .msg .by { font-size: 11.5px; color: var(--on-surface-variant); margin: 4px 4px 0; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .msg .by .material-symbols-outlined { font-size: 14px; }
  .msg .by .status { display: inline-flex; align-items: center; gap: 3px; }
  .msg .by + .by { margin-top: 1px; }
  .msg .by .status.failed { color: var(--error); font-weight: 600; }
  .msg .by .status.ok { color: var(--ok); }
  .sys { align-self: center; max-width: 88%; text-align: center; font-size: 12px; color: var(--on-surface-variant); background: var(--surface-container); padding: 6px 12px; border-radius: var(--r-xl); line-height: 1.45; }
  .settle { animation: settle 260ms var(--settle); }
  @keyframes settle { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .composer { flex-shrink: 0; padding: 12px 24px 16px; background: var(--surface-lowest); border-top: 1px solid var(--surface-variant); }
  .composer .box { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea {
    flex: 1; min-width: 0; resize: none; font-family: var(--font-body); font-size: 14.5px; line-height: 1.45; color: var(--on-surface);
    background: var(--surface-lowest); border: 1px solid var(--outline-variant); border-radius: var(--r-xl); padding: 10px 12px; outline: none; max-height: 140px;
    transition: border-color 150ms var(--settle), box-shadow 150ms var(--settle);
  }
  .composer textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(77, 42, 250, .14); }
  .composer .note { font-size: 12px; color: var(--on-surface-variant); margin-top: 8px; line-height: 1.45; }
  .placeholder { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; color: var(--on-surface-variant); text-align: center; line-height: 1.55; }
  .placeholder .inner { max-width: 360px; }
  .placeholder .material-symbols-outlined { font-size: 36px; color: var(--outline-variant); display: block; margin: 0 auto 10px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 14px; border-radius: var(--r-xl); font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 200ms var(--settle); max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; }

  /* ---- phone: one pane at a time ---- */
  @media (max-width: 760px) {
    .bar { padding: 10px 16px; gap: 8px; }
    .bar .hide-sm { display: none; }
    .ghost { padding: 6px 8px; }
    .ghost .ico { display: inline; }
    .ghost .lbl { display: none; }
    .panes { grid-template-columns: minmax(0, 1fr); }
    .list { border-right: 0; }
    body[data-view="thread"] .list { display: none; }
    body[data-view="list"] .thread { display: none; }
    .back { display: inline-flex; }
    .list-head { padding: 16px 16px 10px; }
    .row { padding: 12px 16px; }
    .thread-head { padding: 10px 16px; gap: 8px; flex-wrap: wrap; }
    .thread-head .title { flex-basis: 0; }
    .thread-head .state { display: none; }
    .feed { padding: 16px; }
    .msg { max-width: 88%; }
    .composer { padding: 10px 16px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .settle { animation: none; }
    * { transition-duration: 1ms !important; }
  }
</style>
</head>
<body data-view="list" id="tenant-inbox">
<header class="bar">
  <div class="disc" aria-hidden="true">M</div>
  <div class="salon" id="salonName">…</div>
  <span class="where hide-sm" id="where">Inbox</span>
  <div class="grow"></div>
  <span class="who hide-sm" id="who"></span>
  <a class="ghost" href="/screens/setup.html" id="setupLink"><span class="material-symbols-outlined ico" aria-hidden="true">tune</span><span class="lbl">Setup</span></a>
  <button class="ghost" id="logout" type="button"><span class="material-symbols-outlined ico" aria-hidden="true">logout</span><span class="lbl">Sign out</span></button>
</header>

<div class="panes">
  <section class="list" aria-labelledby="listTitle">
    <div class="list-head">
      <h1 id="listTitle">Conversations</h1>
      <div class="seg" role="group" id="filter">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="need" aria-pressed="false">Needs you</button>
      </div>
    </div>
    <div class="rows" id="rows"></div>
  </section>
  <section class="thread" id="thread" aria-live="polite"></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  var TEXT = {
    en: {
      colon: ": ",
      inbox: "Inbox", conversations: "Conversations", all: "All", need: "Needs you", setup: "Setup", signOut: "Sign out",
      telegram: "Telegram client", web: "Web client", other: "Client",
      viaTelegram: "Telegram", viaWeb: "Web chat", noChannel: "No live channel",
      stateMaya: "Maya is answering", stateNeed: "Needs you", stateYou: "You are answering",
      flagNeed: "Needs you", flagYou: "You answer", flagTest: "Your test",
      takeOver: "Take over", handBack: "Let Maya continue",
      waitingN: function (n) { return n === 1 ? "1 new message" : n + " new messages"; },
      back: "Back to conversations", send: "Send", placeholder: "Write your answer…",
      noteMaya: "Sending an answer pauses Maya in this conversation until you hand it back.",
      noteYou: "Maya is paused here. Clients see your answers as the salon team. If nobody answers for 12 hours, Maya takes the conversation back.",
      noteOther: "This conversation has no live channel. Your note is saved here only.",
      maya: "Maya", you: "You", client: "Client",
      delivered: "Delivered in Telegram", failed: "Not delivered", waiting: "Waiting for the client to open the chat", seen: "Seen in the web chat", sending: "Sending…",
      failedWhy: { telegram_not_connected: "the Telegram bot is not connected", blocked: "the client blocked the salon's bot", noChat: "the client has not started the bot", other: "Telegram refused it" },
      testChat: "Your test chat",
      emptyTitle: "No conversations yet",
      emptyBody: "When a client writes to Maya in your web chat or on Telegram, the conversation shows up here. Want to see how it looks? Open your test chat.",
      emptyNeed: "Nobody is waiting for you right now.",
      openTest: "Open your test chat",
      pick: "Pick a conversation to read it.",
      sentOk: "Sent.", sentWait: "Saved. The client sees it when they open the chat again.", sentFail: "Telegram refused the message. It is saved here.",
      loadFail: "Could not load the inbox. Check your connection and reload the page.",
      today: "Today", yesterday: "Yesterday"
    },
    fr: {
      colon: "\u00a0: ",
      inbox: "Boîte de réception", conversations: "Conversations", all: "Toutes", need: "À traiter", setup: "Configuration", signOut: "Se déconnecter",
      telegram: "Client Telegram", web: "Client web", other: "Client",
      viaTelegram: "Telegram", viaWeb: "Clavardage web", noChannel: "Aucun canal actif",
      stateMaya: "Maya répond", stateNeed: "À traiter", stateYou: "Vous répondez",
      flagNeed: "À traiter", flagYou: "Vous répondez", flagTest: "Votre test",
      takeOver: "Prendre la main", handBack: "Laisser Maya continuer",
      waitingN: function (n) { return n === 1 ? "1 nouveau message" : n + " nouveaux messages"; },
      back: "Retour aux conversations", send: "Envoyer", placeholder: "Écrivez votre réponse…",
      noteMaya: "Votre réponse met Maya en pause dans cette conversation jusqu'à ce que vous lui rendiez la main.",
      noteYou: "Maya est en pause ici. Les clients voient vos réponses au nom du salon. Sans réponse pendant 12 heures, Maya reprend la conversation.",
      noteOther: "Cette conversation n'a aucun canal actif. Votre note est seulement enregistrée ici.",
      maya: "Maya", you: "Vous", client: "Client",
      delivered: "Livré dans Telegram", failed: "Non livré", waiting: "En attente : le client n'a pas encore rouvert le clavardage", seen: "Vu dans le clavardage web", sending: "Envoi…",
      failedWhy: { telegram_not_connected: "le robot Telegram n'est pas connecté", blocked: "le client a bloqué le robot du salon", noChat: "le client n'a pas démarré le robot", other: "Telegram l'a refusé" },
      testChat: "Votre clavardage test",
      emptyTitle: "Aucune conversation pour l'instant",
      emptyBody: "Quand un client écrit à Maya dans votre clavardage web ou sur Telegram, la conversation apparaît ici. Pour voir à quoi ça ressemble, ouvrez votre clavardage test.",
      emptyNeed: "Personne ne vous attend pour l'instant.",
      openTest: "Ouvrir votre clavardage test",
      pick: "Choisissez une conversation pour la lire.",
      sentOk: "Envoyé.", sentWait: "Enregistré. Le client le verra en rouvrant le clavardage.", sentFail: "Telegram a refusé le message. Il est enregistré ici.",
      loadFail: "Impossible de charger la boîte de réception. Vérifiez votre connexion et rechargez la page.",
      today: "Aujourd'hui", yesterday: "Hier"
    },
    ru: {
      colon: ": ",
      inbox: "Входящие", conversations: "Переписки", all: "Все", need: "Ждут вас", setup: "Настройка", signOut: "Выйти",
      telegram: "Клиент из Telegram", web: "Клиент с сайта", other: "Клиент",
      viaTelegram: "Telegram", viaWeb: "Чат на сайте", noChannel: "Нет канала связи",
      stateMaya: "Отвечает Майя", stateNeed: "Ждёт вас", stateYou: "Отвечаете вы",
      flagNeed: "Ждёт вас", flagYou: "Отвечаете вы", flagTest: "Ваш тест",
      takeOver: "Ответить самой", handBack: "Пусть Майя продолжит",
      waitingN: function (n) { return "Новых сообщений: " + n; },
      back: "К списку переписок", send: "Отправить", placeholder: "Напишите ответ…",
      noteMaya: "Ваш ответ ставит Майю на паузу в этой переписке, пока вы не вернёте её.",
      noteYou: "Майя здесь на паузе. Клиент видит ваши ответы от имени салона. Если 12 часов никто не ответит, Майя снова возьмёт переписку.",
      noteOther: "У этой переписки нет канала связи. Заметка сохранится только здесь.",
      maya: "Майя", you: "Вы", client: "Клиент",
      delivered: "Доставлено в Telegram", failed: "Не доставлено", waiting: "Клиент ещё не открыл чат", seen: "Прочитано в чате на сайте", sending: "Отправляем…",
      failedWhy: { telegram_not_connected: "Telegram-бот не подключён", blocked: "клиент заблокировал бота салона", noChat: "клиент не запускал бота", other: "Telegram его не принял" },
      testChat: "Ваш тестовый чат",
      emptyTitle: "Переписок пока нет",
      emptyBody: "Когда клиент напишет Майе в чат на сайте или в Telegram, переписка появится здесь. Посмотреть, как это выглядит, можно в тестовом чате.",
      emptyNeed: "Сейчас вас никто не ждёт.",
      openTest: "Открыть тестовый чат",
      pick: "Выберите переписку, чтобы прочитать её.",
      sentOk: "Отправлено.", sentWait: "Сохранено. Клиент увидит ответ, когда снова откроет чат.", sentFail: "Telegram не принял сообщение. Оно сохранено здесь.",
      loadFail: "Не удалось загрузить входящие. Проверьте связь и обновите страницу.",
      today: "Сегодня", yesterday: "Вчера"
    }
  };
  var LOCALE = { en: "en-CA", fr: "fr-CA", ru: "ru-RU" };
  var GENERIC = /^(web client|telegram client|веб-гость|client web|client telegram|веб-клиент|telegram-клиент)(\s|$)/i;

  var params = new URLSearchParams(location.search);
  var data = null;
  var T = TEXT.en;
  var lang = "en";
  var selectedId = params.get("conversationId") || "";
  var filter = "all";
  var drafts = {};
  var shownIds = {};
  var sending = false;

  var $ = function (id) { return document.getElementById(id); };
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  function toast(text) {
    var node = $("toast");
    node.textContent = text;
    node.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { node.classList.remove("show"); }, 2800);
  }
  function api(method, url, body) {
    return fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body)
    }).then(function (response) {
      if (response.status === 401) { location.replace("/screens/login.html?next=" + encodeURIComponent(location.pathname + location.search)); throw new Error("signed out"); }
      return response.json().then(function (payload) { return { status: response.status, data: payload }; });
    });
  }

  function displayName(conv) {
    if (conv.test && conv.generic) return T.testChat;
    if (!conv.generic) return conv.name;
    var tail = String(conv.name).replace(GENERIC, "").trim();
    var label = conv.kind === "telegram" ? T.telegram : conv.kind === "web" ? T.web : T.other;
    return tail ? label + " " + tail : label;
  }
  function initials(conv) {
    if (conv.generic) return "";
    return String(conv.name).split(/\s+/).map(function (part) { return part.charAt(0); }).join("").slice(0, 2).toUpperCase();
  }
  function channelLabel(conv) {
    return conv.kind === "telegram" ? T.viaTelegram : conv.kind === "web" ? T.viaWeb : T.noChannel;
  }
  function tz() { return (data && data.salon && data.salon.timezone) || undefined; }
  function dayKey(iso) {
    try { return new Intl.DateTimeFormat("en-CA", { timeZone: tz(), year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(iso)); } catch (e) { return String(iso).slice(0, 10); }
  }
  function timeOf(iso) {
    try { return new Intl.DateTimeFormat(LOCALE[lang], { timeZone: tz(), hour: "numeric", minute: "2-digit" }).format(new Date(iso)); } catch (e) { return ""; }
  }
  function dayLabel(iso) {
    var today = dayKey(new Date().toISOString());
    var yesterday = dayKey(new Date(Date.now() - 86400000).toISOString());
    var key = dayKey(iso);
    if (key === today) return T.today;
    if (key === yesterday) return T.yesterday;
    try { return new Intl.DateTimeFormat(LOCALE[lang], { timeZone: tz(), weekday: "short", month: "short", day: "numeric" }).format(new Date(iso)); } catch (e) { return key; }
  }
  function whenShort(iso) {
    if (!iso) return "";
    return dayKey(iso) === dayKey(new Date().toISOString()) ? timeOf(iso) : dayLabel(iso);
  }

  function applyChrome() {
    document.documentElement.lang = lang === "fr" ? "fr-CA" : lang;
    $("salonName").textContent = data.salon.name;
    document.title = data.salon.name + " — " + T.inbox;
    $("where").textContent = T.inbox;
    $("listTitle").textContent = T.conversations;
    $("setupLink").querySelector(".lbl").textContent = T.setup;
    $("setupLink").setAttribute("aria-label", T.setup);
    $("logout").querySelector(".lbl").textContent = T.signOut;
    $("logout").setAttribute("aria-label", T.signOut);
    var owner = data.owner || {};
    $("who").textContent = owner.displayName && owner.displayName !== owner.email ? owner.displayName + " · " + owner.email : (owner.email || "");
    var buttons = $("filter").querySelectorAll("button");
    var needCount = data.conversations.filter(function (conv) { return conv.state === "needs_human"; }).length;
    buttons[0].textContent = T.all;
    buttons[1].textContent = T.need + (needCount ? " · " + needCount : "");
  }

  function visibleConversations() {
    return data.conversations.filter(function (conv) { return filter === "all" || conv.state === "needs_human"; });
  }

  function renderList() {
    var list = visibleConversations();
    if (!list.length) {
      $("rows").innerHTML = filter === "need"
        ? '<div class="empty">' + esc(T.emptyNeed) + "</div>"
        : '<div class="empty"><strong>' + esc(T.emptyTitle) + "</strong>" + esc(T.emptyBody) + '<br/><a href="' + esc(data.chatUrl) + '" target="_blank" rel="noopener">' + esc(T.openTest) + "</a></div>";
      return;
    }
    $("rows").innerHTML = list.map(function (conv) {
      var flag = conv.state === "needs_human" ? '<span class="flag need">' + esc(T.flagNeed) + "</span>"
        : conv.state === "takeover" ? '<span class="flag you">' + esc(T.flagYou) + "</span>" : "";
      if (conv.test) flag += ' <span class="flag test">' + esc(T.flagTest) + "</span>";
      if (conv.waiting && conv.state !== "maya") flag += ' <span class="flag need">' + esc(T.waitingN(conv.waiting)) + "</span>";
      var who = conv.lastAuthor === "staff" ? T.you + T.colon : conv.lastAuthor === "maya" ? T.maya + T.colon : "";
      var ava = initials(conv) || '<span class="material-symbols-outlined" aria-hidden="true">' + (conv.kind === "telegram" ? "send" : "chat") + "</span>";
      return '<button class="row" type="button" data-id="' + esc(conv.id) + '"' + (conv.id === selectedId ? ' aria-current="true"' : "") + ">" +
        '<span class="ava" aria-hidden="true">' + ava + "</span>" +
        '<span style="min-width:0"><div class="name">' + esc(displayName(conv)) + '</div><div class="sub">' + esc(who + (conv.preview || "")) + "</div>" + flag + "</span>" +
        '<span class="when">' + esc(whenShort(conv.updatedAt)) + "<br/>" + esc(channelLabel(conv)) + "</span></button>";
    }).join("");
  }

  function deliveryLine(message) {
    if (message.author !== "staff" || !message.delivery) return "";
    var icon = { delivered: "done_all", seen: "done_all", waiting: "schedule", failed: "error", sending: "schedule" }[message.delivery] || "";
    var text = T[message.delivery] || "";
    if (message.delivery === "failed") {
      var note = String(message.deliveryNote || "");
      var why = T.failedWhy[note] || (/blocked/i.test(note) ? T.failedWhy.blocked : /chat not found|deactivated/i.test(note) ? T.failedWhy.noChat : T.failedWhy.other);
      text += T.colon + why;
    }
    var cls = message.delivery === "failed" ? "failed" : (message.delivery === "delivered" || message.delivery === "seen") ? "ok" : "";
    return '<span class="status ' + cls + '">' + (icon ? '<span class="material-symbols-outlined" aria-hidden="true">' + icon + "</span>" : "") + esc(text) + "</span>";
  }

  function renderThread() {
    var box = $("thread");
    var conv = data.conversations.filter(function (entry) { return entry.id === selectedId; })[0];
    if (!conv) {
      document.body.setAttribute("data-view", "list");
      box.innerHTML = '<div class="placeholder"><div class="inner"><span class="material-symbols-outlined" aria-hidden="true">forum</span>' + esc(data.conversations.length ? T.pick : T.emptyTitle) + "</div></div>";
      return;
    }
    var stateCls = conv.state === "needs_human" ? " need" : conv.state === "takeover" ? " you" : "";
    var stateText = conv.state === "needs_human" ? T.stateNeed : conv.state === "takeover" ? T.stateYou : T.stateMaya;
    var action = conv.kind === "other" ? "" : conv.state === "maya"
      ? '<button class="btn quiet" type="button" id="toggleMaya" data-active="false">' + esc(T.takeOver) + "</button>"
      : '<button class="btn quiet" type="button" id="toggleMaya" data-active="true">' + esc(T.handBack) + "</button>";
    var meta = [channelLabel(conv), conv.phone].filter(Boolean).join(" · ");
    var feedHtml = "";
    var lastDay = "";
    conv.messages.forEach(function (message) {
      var key = message.createdAt ? dayKey(message.createdAt) : "";
      if (key && key !== lastDay) { feedHtml += '<div class="day">' + esc(dayLabel(message.createdAt)) + "</div>"; lastDay = key; }
      var fresh = shownIds[conv.id] && !shownIds[conv.id][message.id] ? " settle" : "";
      if (message.type === "system") { feedHtml += '<div class="sys' + fresh + '">' + esc(message.text) + "</div>"; return; }
      var kind = message.author === "client" || message.type === "incoming" ? "in" : message.author === "staff" ? "out staff" : "out maya";
      var by = message.type === "incoming" ? displayName(conv) : message.author === "staff" ? T.you : T.maya;
      var line = deliveryLine(message);
      feedHtml += '<div class="msg ' + kind + fresh + '"><div class="bubble">' + esc(message.text) + "</div>" +
        '<div class="by">' + esc(by) + (message.createdAt ? " · " + esc(timeOf(message.createdAt)) : "") + "</div>" + (line ? '<div class="by">' + line + "</div>" : "") + "</div>";
    });
    var seen = {};
    conv.messages.forEach(function (message) { seen[message.id] = true; });
    shownIds[conv.id] = seen;

    var note = conv.kind === "other" ? T.noteOther : conv.state === "maya" ? T.noteMaya : T.noteYou;
    var hadFocus = document.activeElement && document.activeElement.id === "reply";
    box.innerHTML =
      '<div class="thread-head">' +
        '<button class="back" type="button" id="back" aria-label="' + esc(T.back) + '"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span></button>' +
        '<div class="title"><h2>' + esc(displayName(conv)) + "</h2>" + '<div class="meta">' + esc(meta) + "</div></div>" +
        '<span class="state' + stateCls + '">' + esc(stateText) + "</span>" + action +
      "</div>" +
      '<div class="feed" id="feed">' + feedHtml + "</div>" +
      '<form class="composer" id="composer"><div class="box">' +
        '<textarea id="reply" rows="1" placeholder="' + esc(T.placeholder) + '" aria-label="' + esc(T.placeholder) + '">' + esc(drafts[conv.id] || "") + "</textarea>" +
        '<button class="btn" type="submit" id="sendBtn"' + (sending ? " disabled" : "") + '><span class="material-symbols-outlined" aria-hidden="true" style="font-size:18px">send</span><span>' + esc(T.send) + "</span></button>" +
      '</div><div class="note">' + esc(note) + "</div></form>";
    var feed = $("feed");
    feed.scrollTop = feed.scrollHeight;
    var reply = $("reply");
    autosize(reply);
    if (hadFocus) { reply.focus(); reply.setSelectionRange(reply.value.length, reply.value.length); }
    reply.addEventListener("input", function () { drafts[conv.id] = reply.value; autosize(reply); });
    reply.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); submit(conv); }
    });
    $("composer").addEventListener("submit", function (event) { event.preventDefault(); submit(conv); });
    $("back").addEventListener("click", function () {
      document.body.setAttribute("data-view", "list");
      selectedId = "";
      history.replaceState(null, "", location.pathname);
      renderList();
    });
    var toggle = $("toggleMaya");
    if (toggle) toggle.addEventListener("click", function () {
      toggle.disabled = true;
      api("POST", "/api/inbox/conversations/" + encodeURIComponent(conv.id) + "/maya", { active: toggle.getAttribute("data-active") === "true" })
        .then(load).catch(function () { toggle.disabled = false; });
    });
  }

  function autosize(node) {
    node.style.height = "auto";
    node.style.height = Math.min(node.scrollHeight, 140) + "px";
  }

  function submit(conv) {
    var reply = $("reply");
    var text = String(reply.value || "").trim();
    if (!text || sending) return;
    sending = true;
    $("sendBtn").disabled = true;
    api("POST", "/api/inbox/conversations/" + encodeURIComponent(conv.id) + "/reply", { text: text }).then(function (result) {
      sending = false;
      if (result.status >= 400) { toast(T.sentFail); renderThread(); return; }
      drafts[conv.id] = "";
      toast(result.data.delivery === "failed" ? T.sentFail : result.data.delivery === "waiting" ? T.sentWait : T.sentOk);
      return load();
    }).catch(function () {
      sending = false;
      toast(T.loadFail);
      renderThread();
    });
  }

  function select(id) {
    selectedId = id;
    document.body.setAttribute("data-view", "thread");
    history.replaceState(null, "", location.pathname + "?conversationId=" + encodeURIComponent(id));
    renderList();
    renderThread();
  }

  function render() {
    applyChrome();
    renderList();
    renderThread();
  }

  function load() {
    return api("GET", "/api/inbox").then(function (result) {
      if (result.status !== 200) throw new Error("load");
      data = result.data;
      lang = TEXT[data.language] ? data.language : "en";
      T = TEXT[lang];
      if (selectedId && data.conversations.some(function (conv) { return conv.id === selectedId; })) {
        if (document.body.getAttribute("data-view") !== "thread" && !load.done) document.body.setAttribute("data-view", "thread");
      } else if (!load.done && !selectedId && data.conversations.length && window.matchMedia("(min-width: 761px)").matches) {
        selectedId = (data.conversations.filter(function (conv) { return !conv.test; })[0] || data.conversations[0]).id;
      }
      load.done = true;
      render();
    }).catch(function (error) {
      if (error && error.message === "signed out") return;
      if (!data) $("rows").innerHTML = '<div class="empty">' + esc(T.loadFail) + "</div>";
    });
  }

  $("rows").addEventListener("click", function (event) {
    var row = event.target.closest(".row");
    if (row) select(row.getAttribute("data-id"));
  });
  $("filter").addEventListener("click", function (event) {
    var button = event.target.closest("button[data-filter]");
    if (!button || !data) return;
    filter = button.getAttribute("data-filter");
    Array.prototype.forEach.call($("filter").querySelectorAll("button"), function (node) {
      node.setAttribute("aria-pressed", String(node === button));
    });
    renderList();
  });
  $("logout").addEventListener("click", function () {
    fetch("/api/auth/logout", { method: "POST" }).then(function () { location.replace("/screens/login.html"); });
  });

  load();
  // New client messages and delivery updates arrive without a reload.
  setInterval(function () {
    if (document.visibilityState === "visible" && !sending) load();
  }, 12000);
})();
</script>
</body></html>
